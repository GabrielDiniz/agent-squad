services:
  mysql:
    image: mysql:8.0
    container_name: agent-squad-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_squad}
      MYSQL_USER: ${MYSQL_USER:-agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agentpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "--password=${MYSQL_ROOT_PASSWORD:-rootpassword}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  agent:
    build:
      context: .
    container_name: agent-squad-app
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    ports:
      - "${WEBHOOK_PORT:-3000}:${WEBHOOK_PORT:-3000}"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_squad}
      MYSQL_USER: ${MYSQL_USER:-agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agentpassword}
      CODEBASES_CONFIG: /app/codebases.json
      CODEBASES_MODE: ${CODEBASES_MODE:-url}
      CODEBASES_ROOT: ${CODEBASES_ROOT:-/workspace/codebases}
      CODEBASES_ALLOWED_HOSTS: ${CODEBASES_ALLOWED_HOSTS:-github.com,gitlab.com,bitbucket.org}
      CODEBASE_CLONE_RETRIES: ${CODEBASE_CLONE_RETRIES:-1}
      CODEBASE_CLONE_TIMEOUT_MS: ${CODEBASE_CLONE_TIMEOUT_MS:-300000}
      WEBHOOK_SIGNATURE_REQUIRED: ${WEBHOOK_SIGNATURE_REQUIRED:-0}
      JIRA_WEBHOOK_SIGNATURE_HEADER: ${JIRA_WEBHOOK_SIGNATURE_HEADER:-x-hub-signature-256}
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET:-}
    volumes:
      # Configuracao estatica opcional de codebases
      - ./codebases.json:/app/codebases.json:ro
      # Cache interno de repositorios clonados automaticamente por URL
      - codebases_data:/workspace/codebases
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${WEBHOOK_PORT:-3000}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
  codebases_data:
